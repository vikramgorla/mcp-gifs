name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: github.repository == 'vikramgorla/mcp-gifs'
    runs-on: ubuntu-latest
    steps:
      - name: Require Vercel secrets
        id: require
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Optional. Empty or unset leaves KLIPY off (the server treats "" as no key).
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "Vercel project secrets are not set yet; skipping preview deploy."
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.require.outputs.has_secrets == 'true'
      - uses: actions/setup-node@v5
        if: steps.require.outputs.has_secrets == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm i -g vercel@latest
        if: steps.require.outputs.has_secrets == 'true'
      - name: Deploy preview
        if: steps.require.outputs.has_secrets == 'true'
        id: deploy
        run: |
          url=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} --env KLIPY_API_KEY="$KLIPY_API_KEY")
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
      - name: Smoke test preview (search "facepalm")
        if: steps.require.outputs.has_secrets == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          body='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"search_gifs","arguments":{"query":"facepalm","limit":5}}}'
          out=$(vercel curl /mcp --deployment "$URL" --yes -- --silent --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --header 'MCP-Protocol-Version: 2025-06-18' \
            --data "$body")
          echo "$out" | head -c 3000; echo
          json=$(echo "$out" | sed -n 's/^data: //p' | head -1); [ -n "$json" ] || json="$out"
          sources=$(echo "$json" | jq -r '.result.structuredContent.results[]?.source' | sort | uniq -c)
          echo "Notes:"; echo "$json" | jq -r '.result.structuredContent.notes[]?, .error.message?' || true
          echo "Sources returned for \"facepalm\":"; echo "$sources"
          { echo "### Smoke test: search \"facepalm\""; echo '```'; echo "$sources"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ -n "$sources" ] || { echo "No results"; exit 1; }
          if [ -n "$KLIPY_API_KEY" ]; then
            echo "$sources" | grep -q klipy || { echo "KLIPY key is set but no klipy results"; exit 1; }
          fi
      - name: Comment preview URL
        if: steps.require.outputs.has_secrets == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const body = `Preview deployment: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith('Preview deployment:'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
