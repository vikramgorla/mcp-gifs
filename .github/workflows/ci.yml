name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Worker bundle builds (dry run, no deploy)
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm run build
